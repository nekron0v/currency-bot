services:
  - type: web
    name: currency-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: OCRSPACE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.5"